# SPDX-License-Identifier: MIT
#
# Runs the checks of the flake (tests/default.nix) on x86_64-linux and on
# aarch64-linux, each on a runner of that system, and evaluates every
# output for both systems.
name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            netrc-file = /etc/nix/netrc
      - name: Authenticate fixed GitHub archive downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" \
            | sudo tee /etc/nix/netrc > /dev/null
          sudo chmod 600 /etc/nix/netrc
      - name: Build the Composer integration
        run: nix build --out-link "$RUNNER_TEMP/composer-tools"
      - name: Compose, edit, build, publish, and consume with ordinary Composer
        run: |
          nix shell 'nixpkgs#python3' -c \
            python3 tests/composition-native.py "$RUNNER_TEMP/composer-tools"

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            netrc-file = /etc/nix/netrc

      # The fixtures download GitHub zipballs from api.github.com, which
      # limits requests without a token by IP address, and the runners
      # share addresses. Nix's built-in fetcher reads credentials from the
      # netrc file, so the downloads use the token of this job.
      - name: Give the Nix daemon the job token for api.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" \
            | sudo tee /etc/nix/netrc > /dev/null
          sudo chmod 600 /etc/nix/netrc

      - name: Run the checks
        run: nix flake check --print-build-logs

      - name: Evaluate every output for both systems
        run: nix flake check --all-systems --no-build

      - name: Historical PHP and native Composer lifecycle
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          for cohort in legacy-php php56 php54 php53; do
            case "$cohort" in
              legacy-php) php_version=7.4.29 ;;
              php56) php_version=5.6.26 ;;
              php54) php_version=5.4.44 ;;
              php53) php_version=5.3.28 ;;
            esac
            for point in 1 22; do
              case "$point" in
                1) version=1.10.27 ;;
                22) version=2.2.26 ;;
              esac
              tools="$(nix build --no-link --print-out-paths ".#checks.x86_64-linux.$cohort-composer$point-tools")"
              repository="$(nix build --no-link --print-out-paths ".#checks.x86_64-linux.$cohort-composer$point.project.projections.composer")"
              python3 tests/historical-native.py "$tools" "$repository" "$version" "$php_version" "$cohort"
            done
          done

      # A check cannot run Nix, so `nix build --rebuild`, which builds one
      # derivation twice and compares the outputs, runs here.
      - name: conformance-rebuild
        run: |
          nix build --file tests/app-package.nix --no-link
          nix build --file tests/app-package.nix --no-link --rebuild

      # A check cannot run a build that has to fail, so the rejection of a
      # tampered hash at download time runs here.
      - name: conformance-tampered
        run: |
          if nix build --file tests/tampered-hash.nix --no-link 2> tampered.log; then
            echo "Nix accepted a download that does not match its locked hash" >&2
            exit 1
          fi
          grep 'hash mismatch in fixed-output derivation' tampered.log
